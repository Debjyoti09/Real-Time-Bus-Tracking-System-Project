# MySQL configuration (database name remains bustracking)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bustracking}
spring.datasource.username=${DB_USERNAME:bustracking}
spring.datasource.password=${DB_PASSWORD:bustracking123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Admin credentials: override these environment variables outside local development
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:Admin@12345}

# Permit local development and ngrok HTTPS origins for phone-based GPS testing.
# Override with a comma-separated allow-list in production.
app.websocket.allowed-origin-patterns=${WS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.ngrok-free.dev,https://*.ngrok-free.app,https://*.ngrok.io}
